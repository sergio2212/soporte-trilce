<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f26b1d">
<title>Técnico · Soporte Trilce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8f2; --card: #fff; --text: #2a1a10; --muted: #7a6657;
    --brand: #f26b1d; --brand-dark: #c4510e; --brand-soft: #ffeadb; --line: #f0dfd2;
    --err: #c0392b; --ok: #1d8a4a; --info: #1d5fa8; --warn: #7a5a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  .oculto { display: none !important; }
  button { font: inherit; cursor: pointer; color: inherit; }
  h1, h2, p { margin-top: 0; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 46px; }
  input:focus, textarea:focus { outline: 3px solid color-mix(in srgb, var(--brand) 35%, transparent); border-color: var(--brand); }
  label.campo { display: block; font-weight: 700; font-size: .9rem; margin: 14px 0 6px; }
  .error { color: var(--err); font-weight: 600; margin: 10px 0 0; }
  .aviso { color: var(--muted); font-size: .9rem; }
  .btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 16px; min-height: 48px; font-weight: 700; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primario { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.no { background: #fff; border-color: var(--err); color: var(--err); }
  .btn.chico { min-height: 36px; padding: 4px 14px; font-size: .88rem; }
  .btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  /* login */
  #vista-login { max-width: 400px; margin: 0 auto; padding: 56px 16px; }
  .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .marca-icono { width: 40px; height: 40px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; flex: none; }
  .marca b { display: block; line-height: 1.15; } .marca span { color: var(--muted); font-size: .85rem; }
  #vista-login h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 4px; }

  /* app */
  .banda { background: var(--brand); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  .banda .marca-icono { background: #fff; color: var(--brand); width: 38px; height: 38px; }
  .banda .quien { flex: 1; min-width: 0; line-height: 1.2; }
  .banda .quien b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .banda .quien small { opacity: .9; }
  .banda .btn { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.5); color: #fff; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 6px; padding: 4px; background: var(--brand-soft); border-radius: 14px; margin-bottom: 14px; }
  .tab { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; color: var(--brand-dark); }
  .tab.activa { background: var(--brand); color: #fff; }
  .tab .n { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: #fff; color: var(--brand-dark); font-size: .8rem; }
  .estado-red { font-size: .82rem; color: var(--muted); margin: 0 0 10px; }

  .ticket { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .ticket .donde { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .ticket .sede { color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .ticket .que { font-weight: 700; }
  .ticket .quien-reporta { color: var(--muted); font-size: .92rem; }
  .ticket .cita { margin-top: 8px; padding: 8px 12px; background: var(--bg); border-radius: 10px; font-style: italic; }
  .ticket .nota { margin-top: 8px; padding: 8px 12px; background: #e3effc; border-radius: 10px; font-size: .9rem; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: #e3effc; color: var(--info); }
  .chip.solucionando { background: #fff3c4; color: var(--warn); }
  .chip.resuelto { background: #dff3e6; color: var(--ok); }
  .chip.critica { background: var(--err); color: #fff; } .chip.alta { background: var(--brand-soft); color: var(--brand-dark); }
  .fila-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .acciones { display: grid; gap: 8px; margin-top: 14px; }
  .acciones .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vacio { text-align: center; color: var(--muted); padding: 40px 16px; }
  .vacio b { display: block; font-size: 1.1rem; color: var(--text); margin-bottom: 4px; }

  dialog { border: 0; border-radius: 20px; padding: 0; width: min(440px, calc(100vw - 24px)); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(42,26,16,.5); }
  .dlg { padding: 20px; }
  .dlg h2 { font-size: 1.2rem; margin-bottom: 4px; }
  .dlg .pie { display: flex; gap: 8px; margin-top: 16px; } .dlg .pie .btn { flex: 1; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2a1a10; color: #fff; padding: 12px 18px; border-radius: 12px; max-width: calc(100vw - 32px); z-index: 20; font-weight: 600; }
</style>
</head>
<body>

<!-- ===================== ACCESO ===================== -->
<section id="vista-login">
  <div class="marca"><div class="marca-icono" aria-hidden="true">T</div><div><b>Trilce TI</b><span>Técnicos de campo</span></div></div>
  <h1>Ingreso de técnicos</h1>
  <p class="aviso" style="margin-bottom:18px">Aquí ves a qué aula debes ir y marcas si el problema quedó resuelto.</p>
  <form id="form-login" novalidate>
    <label class="campo" for="correo">Correo</label>
    <input id="correo" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="campo" for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password">
    <p id="login-error" class="error oculto" role="alert"></p>
    <p id="login-espera" class="aviso oculto">Conectando… si el sistema estaba dormido puede tardar hasta 1 minuto.</p>
    <button id="login-boton" class="btn primario" type="submit" style="width:100%;margin-top:16px">Ingresar</button>
  </form>
</section>

<!-- ===================== APLICACIÓN ===================== -->
<div id="app" class="oculto">
  <header class="banda">
    <div class="marca-icono" aria-hidden="true">T</div>
    <div class="quien"><b id="u-nombre"></b><small id="u-detalle"></small></div>
    <button id="salir" class="btn chico" type="button">Salir</button>
  </header>
  <main>
    <div class="tabs" role="tablist">
      <button id="tab-pendientes" class="tab activa" type="button" role="tab" aria-selected="true">Por atender<span class="n" id="n-pendientes">0</span></button>
      <button id="tab-resueltos" class="tab" type="button" role="tab" aria-selected="false">Resueltos</button>
    </div>
    <p id="estado-red" class="estado-red" aria-live="polite"></p>
    <div id="lista" aria-live="polite"></div>
  </main>
</div>

<dialog id="dlg-nota" aria-labelledby="dn-titulo">
  <form class="dlg" id="form-nota" method="dialog" novalidate>
    <h2 id="dn-titulo"></h2>
    <p id="dn-sub" class="aviso" style="margin-bottom:6px"></p>
    <label class="campo" for="dn-texto" id="dn-etiqueta"></label>
    <textarea id="dn-texto" rows="3" maxlength="500"></textarea>
    <p id="dn-error" class="error oculto" role="alert"></p>
    <div class="pie">
      <button class="btn" type="button" id="dn-cancelar">Cancelar</button>
      <button class="btn primario" type="submit" id="dn-ok">Confirmar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="oculto" role="status" aria-live="polite"></div>

<script>
const API = "https://soporte-trilce.onrender.com";
const CADA_SEGUNDOS = 8;
const $ = (id) => document.getElementById(id);
const el = (tag, clase, texto) => { const e = document.createElement(tag); if (clase) e.className = clase; if (texto !== undefined && texto !== null) e.textContent = texto; return e; };

class SesionVencida extends Error {}
let tokenMem = null, temporizador = null, pestana = "pendientes", datos = { pendientes: [], resueltos: [] }, vistos = null, ahoraServidor = Date.now(), offsetReloj = 0;

function leerToken() { if (tokenMem) return tokenMem; try { return localStorage.getItem("tecnico_token"); } catch (_) { return null; } }
function guardarToken(t) { tokenMem = t; try { t ? localStorage.setItem("tecnico_token", t) : localStorage.removeItem("tecnico_token"); } catch (_) {} }

// Llamada con reintentos (Render gratis se duerme y tarda en despertar)
async function api(ruta, opciones = {}, reintentos = 3) {
  const token = leerToken();
  const cab = Object.assign({}, opciones.headers || {}, token ? { Authorization: "Bearer " + token } : {});
  let ultimo;
  for (let i = 0; i < reintentos; i++) {
    try {
      const r = await fetch(API + ruta, Object.assign({}, opciones, { headers: cab }));
      if (r.status === 401 && ruta !== "/auth/login") throw new SesionVencida();
      return r;
    } catch (e) {
      if (e instanceof SesionVencida) throw e;
      ultimo = e;
      if (i < reintentos - 1) await new Promise((res) => setTimeout(res, 5000));
    }
  }
  throw ultimo;
}
const json = (o) => ({ method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) });
async function detalle(r, porDefecto) { try { const d = await r.json(); return typeof d.detail === "string" ? d.detail : porDefecto; } catch (_) { return porDefecto; } }

let tToast = null;
function toast(t) { const n = $("toast"); n.textContent = t; n.classList.remove("oculto"); clearTimeout(tToast); tToast = setTimeout(() => n.classList.add("oculto"), 4500); }

function mostrar(v) { $("vista-login").classList.toggle("oculto", v !== "login"); $("app").classList.toggle("oculto", v !== "app"); }

// ---------- acceso ----------
function cerrarSesion(mensaje) {
  guardarToken(null); clearInterval(temporizador); vistos = null; datos = { pendientes: [], resueltos: [] };
  document.title = "Técnico · Soporte Trilce";
  mostrar("login");
  const e = $("login-error"); e.textContent = mensaje || ""; e.classList.toggle("oculto", !mensaje);
}
$("form-login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const err = $("login-error"); err.classList.add("oculto");
  const correo = $("correo").value.trim(), clave = $("clave").value;
  if (!correo || !clave) { err.textContent = "Escribe tu correo y contraseña."; err.classList.remove("oculto"); return; }
  const b = $("login-boton"); b.disabled = true; b.textContent = "Ingresando…"; $("login-espera").classList.remove("oculto");
  try {
    const r = await api("/auth/login", json({ correo, password: clave }));
    if (r.status === 401) throw new Error("Correo o contraseña incorrectos.");
    if (!r.ok) throw new Error("No se pudo iniciar sesión. Inténtalo de nuevo.");
    const d = await r.json();
    if (d.usuario.rol !== "tecnico_campo" && d.usuario.rol !== "admin") throw new Error("Esta página es solo para técnicos. Ingresa por la página de Soporte.");
    guardarToken(d.token); $("clave").value = "";
    entrar(d.usuario);
  } catch (ex) {
    err.textContent = ex.message && !/fetch|HTTP|Failed/i.test(ex.message) ? ex.message : "No se pudo conectar con el sistema. Inténtalo de nuevo en un momento.";
    err.classList.remove("oculto");
  } finally { b.disabled = false; b.textContent = "Ingresar"; $("login-espera").classList.add("oculto"); }
});
$("salir").addEventListener("click", () => cerrarSesion(""));

function entrar(u) {
  $("u-nombre").textContent = u.nombre;
  $("u-detalle").textContent = (u.sede || "Todas las sedes") + (u.rol === "admin" ? " · Administrador" : " · Técnico");
  mostrar("app");
  refrescar();
  clearInterval(temporizador);
  temporizador = setInterval(refrescar, CADA_SEGUNDOS * 1000);
}

// ---------- datos ----------
async function refrescar() {
  try {
    const [rp, rr] = await Promise.all([api("/tecnico/tickets?estado=pendientes", {}, 1), api("/tecnico/tickets?estado=resueltos", {}, 1)]);
    if (rp.status === 403 || rr.status === 403) return cerrarSesion("Tu cuenta no tiene acceso a esta página.");
    if (!rp.ok || !rr.ok) throw new Error("HTTP");
    const dp = await rp.json(), dr = await rr.json();
    offsetReloj = Date.parse(dp.ahora) - Date.now();
    avisarNuevos(dp.tickets);
    datos = { pendientes: dp.tickets, resueltos: dr.tickets };
    $("estado-red").textContent = "Actualizado " + new Date().toLocaleTimeString("es-PE", { timeStyle: "short" });
    pintar();
  } catch (e) {
    if (e instanceof SesionVencida) return cerrarSesion("Tu sesión venció. Inicia sesión de nuevo.");
    $("estado-red").textContent = "Sin conexión. Reintentando…";
  }
}
function avisarNuevos(tickets) {
  const ids = new Set(tickets.map((t) => t.id));
  if (vistos) {
    const nuevos = tickets.filter((t) => !vistos.has(t.id));
    if (nuevos.length) { const t = nuevos[0]; toast("Te enviaron a " + aula(t) + " · " + t.equipo + ": " + t.falla + (nuevos.length > 1 ? " (+" + (nuevos.length - 1) + " más)" : "")); }
  }
  vistos = ids;
}

// ---------- pintar ----------
const aula = (t) => "Aula " + (t.ambiente || "–") + (t.piso ? " · Piso " + t.piso : "");
function hace(iso) {
  const min = Math.max(0, Math.round((Date.now() + offsetReloj - Date.parse(iso)) / 60000));
  if (min < 1) return "ahora mismo";
  if (min < 60) return "hace " + min + " min";
  const h = Math.floor(min / 60); return "hace " + h + " h " + (min % 60 ? (min % 60) + " min" : "");
}
const ETQ = { en_camino: "Te están esperando", solucionando: "Solucionando", resuelto: "Resuelto" };
const ETQ_PRIO = { critica: "Crítica", alta: "Alta", media: "Media", baja: "Baja" };

function pintar() {
  const lista = datos[pestana], cont = $("lista");
  $("n-pendientes").textContent = datos.pendientes.length;
  document.title = (datos.pendientes.length ? "(" + datos.pendientes.length + ") " : "") + "Técnico · Soporte Trilce";
  cont.replaceChildren();
  if (!lista.length) {
    const v = el("div", "vacio");
    v.append(el("b", null, pestana === "pendientes" ? "No tienes tickets por atender" : "Aún no has resuelto tickets"),
      el("span", null, pestana === "pendientes" ? "Cuando Soporte te llame a un aula, aparecerá aquí." : "Los que marques como resueltos se mostrarán aquí."));
    cont.append(v); return;
  }
  for (const t of lista) cont.append(tarjeta(t));
}

function tarjeta(t) {
  const c = el("article", "ticket");
  c.append(el("div", "donde", aula(t)), el("div", "sede", t.sede));
  const chips = el("div", "fila-chips");
  chips.append(Object.assign(el("span", "chip " + t.estado, ETQ[t.estado] || t.estado)), el("span", "chip " + t.prioridad, "Urgencia " + (ETQ_PRIO[t.prioridad] || t.prioridad).toLowerCase()));
  c.append(chips, el("div", "que", t.equipo + ": " + t.falla));
  if (t.docente) c.append(el("div", "quien-reporta", "Reportó " + t.docente + (t.tecnico_enviado_en ? " · te enviaron " + hace(t.tecnico_enviado_en) : "")));
  if (t.descripcion) c.append(el("div", "cita", "“" + t.descripcion + "”"));

  if (t.estado === "resuelto") {
    if (t.resuelto_en) c.append(el("div", "quien-reporta", "Resuelto " + hace(t.resuelto_en)));
    return c;
  }
  const acc = el("div", "acciones");
  if (t.estado === "en_camino") {
    const b = el("button", "btn primario", "Llegué · estoy solucionando"); b.type = "button";
    b.addEventListener("click", () => accion(t, "solucionando", b));
    acc.append(b);
  }
  const dos = el("div", "dos");
  const ok = el("button", "btn ok", "Resuelto"); ok.type = "button"; ok.addEventListener("click", () => pedirNota(t, true));
  const no = el("button", "btn no", "No resuelto"); no.type = "button"; no.addEventListener("click", () => pedirNota(t, false));
  dos.append(ok, no); acc.append(dos);
  c.append(acc);
  return c;
}
$("tab-pendientes").addEventListener("click", () => cambiarTab("pendientes"));
$("tab-resueltos").addEventListener("click", () => cambiarTab("resueltos"));
function cambiarTab(p) {
  pestana = p;
  for (const k of ["pendientes", "resueltos"]) { const t = $("tab-" + k); t.classList.toggle("activa", k === p); t.setAttribute("aria-selected", k === p); }
  pintar();
}

// ---------- acciones ----------
async function accion(t, que, boton) {
  boton.disabled = true;
  try {
    const r = await api("/tecnico/tickets/" + t.id + "/" + que, { method: "POST" }, 2);
    if (!r.ok) toast(await detalle(r, "No se pudo actualizar el ticket."));
    else toast("Listo: el docente recibe el aviso en su correo.");
  } catch (e) {
    if (e instanceof SesionVencida) return cerrarSesion("Tu sesión venció. Inicia sesión de nuevo.");
    toast("No se pudo conectar. Inténtalo otra vez.");
  }
  refrescar();
}

let pendienteNota = null;
function pedirNota(t, resuelto) {
  pendienteNota = { t, resuelto };
  $("dn-titulo").textContent = resuelto ? "Marcar como resuelto" : "Marcar como NO resuelto";
  $("dn-sub").textContent = aula(t) + " · " + t.equipo + ": " + t.falla;
  $("dn-etiqueta").textContent = resuelto ? "¿Qué hiciste para solucionarlo?" : "¿Por qué no se pudo resolver?";
  $("dn-ok").textContent = resuelto ? "Sí, resuelto" : "Devolver a Soporte";
  $("dn-ok").className = "btn " + (resuelto ? "ok" : "primario");
  $("dn-texto").value = ""; $("dn-error").classList.add("oculto");
  $("dlg-nota").showModal();
  setTimeout(() => $("dn-texto").focus(), 50);
}
$("dn-cancelar").addEventListener("click", () => $("dlg-nota").close());
$("form-nota").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const err = $("dn-error"), nota = $("dn-texto").value.trim();
  if (nota.length < 3) { err.textContent = "Escribe una nota breve."; err.classList.remove("oculto"); return; }
  const { t, resuelto } = pendienteNota, b = $("dn-ok"); b.disabled = true;
  try {
    const r = await api("/tecnico/tickets/" + t.id + "/" + (resuelto ? "resolver" : "no-resuelto"), json({ nota }), 2);
    if (!r.ok) { err.textContent = await detalle(r, "No se pudo guardar. Inténtalo otra vez."); err.classList.remove("oculto"); return; }
    $("dlg-nota").close();
    toast(resuelto ? "Ticket resuelto. Se avisó al docente." : "Ticket devuelto a Soporte.");
  } catch (e) {
    if (e instanceof SesionVencida) { $("dlg-nota").close(); return cerrarSesion("Tu sesión venció. Inicia sesión de nuevo."); }
    err.textContent = "No se pudo conectar. Inténtalo otra vez."; err.classList.remove("oculto"); return;
  } finally { b.disabled = false; }
  refrescar();
});

// ---------- arranque ----------
(async function iniciar() {
  if (!leerToken()) return mostrar("login");
  try {
    const r = await api("/auth/yo");
    if (!r.ok) throw new Error("HTTP");
    const u = await r.json();
    if (u.rol !== "tecnico_campo" && u.rol !== "admin") return cerrarSesion("Esta página es solo para técnicos.");
    entrar(u);
  } catch (_) { cerrarSesion(""); }
})();
</script>
</body>
</html>
